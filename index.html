<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6">
  <h1 class="text-3xl font-bold text-center text-slate-800 mb-6">Pokédex</h1>

  <div class="max-w-md mx-auto flex gap-2 mb-6">
    <label for="buscador" class="sr-only">Buscar un Pokémon</label>
    <input id="buscador" type="text" placeholder="Nombre o número (ej. charizard o 25)"
           class="flex-1 p-2 rounded-lg border border-slate-300">
    <button id="btn-buscar" class="px-4 py-2 bg-yellow-400 font-semibold rounded-lg hover:bg-yellow-500">
      Buscar
    </button>
  </div>

  <!-- Zonas de estado: carga (#spinner) y errores (#mensaje). hidden las oculta hasta que el JS las muestre -->
  <div id="spinner" class="hidden text-center text-slate-500 my-4">Cargando…</div>
  <div id="mensaje" class="hidden text-center text-red-600 font-medium my-4" role="alert"></div>

  <!-- Aquí el JS pintará las tarjetas. Empieza vacío. -->
  <div id="resultado" class="grid grid-cols-2 md:grid-cols-3 gap-4 max-w-4xl mx-auto"></div>

  <div class="text-center my-6">
    <button id="cargar-mas" class="px-4 py-2 bg-slate-700 text-white rounded-lg hover:bg-slate-800">
      Cargar más
    </button>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
